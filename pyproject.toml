[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "Tools for AI agents: research, memory, vision, sandbox, scrape."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AgentKit Team" }]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "python-multipart>=0.0.6",
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "pydantic>=2.0",
    "openai>=1.0",
    "pillow>=10.0",
    "docker>=7.0",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
]

[project.scripts]
agentkit = "agentkit.main:app"

[tool.setuptools.packages.find]
include = ["agentkit*"]
