services:
  agentkit:
    build: .
    container_name: agentkit
    ports:
      - "8000:8000"
    volumes:
      - agentkit-data:/data
    environment:
      - AGENTKIT_DATA=/data
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AGENTKIT_API_KEYS=${AGENTKIT_API_KEYS:-test-key-123}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  agentkit-data:
